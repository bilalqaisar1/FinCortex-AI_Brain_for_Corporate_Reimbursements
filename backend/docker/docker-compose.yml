version: "3.9"
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ../app:/app/app
      - ../requirements.txt:/app/requirements.txt
      - ../requirements-dev.txt:/app/requirements-dev.txt
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=${DATABASE_URL}
    env_file:
      - ../.env

