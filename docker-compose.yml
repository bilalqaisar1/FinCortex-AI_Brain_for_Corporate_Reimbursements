version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fincortex-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fincortex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: fincortex-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/fincortex
      - MCP_SERVER_URL=http://mcp-server:8001/api/v1
      - FRONTEND_URL=http://65.109.29.54:3000
    depends_on:
      - db
    env_file:
      - ./backend/.env

  mcp-server:
    build: ./MCP-Serverr
    container_name: fincortex-mcp
    restart: always
    ports:
      - "8001:8001"
    environment:
      - MCP_SERVER_PORT=8001
      - MCP_SERVER_HOST=0.0.0.0
    env_file:
      - ./MCP-Serverr/.env

  frontend:
    build:
      context: ./fin-cortex
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_API_URL=http://65.109.29.54:8000
        - NEXT_PUBLIC_BACKEND_URL=http://65.109.29.54:8000
        - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    container_name: fincortex-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://65.109.29.54:8000
      - NEXT_PUBLIC_BACKEND_URL=http://65.109.29.54:8000
      - MCP_SERVER_URL=http://mcp-server:8001
    depends_on:
      - backend
    env_file:
      - ./fin-cortex/.env

volumes:
  postgres_data:
